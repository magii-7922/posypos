<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>攤位收銀</title>
  <style>
    :root {
      --paper: #f3efe4;
      --card: #fffdf8;
      --ink: #1c1915;
      --muted: #5e584e;
      --line: #1c1915;
      --accent: #c2410c;
      --accent-ink: #fff7ed;
      --ok: #145c45;
      --ok-soft: #e5f4ee;
      --warn: #8a4b08;
      --warn-soft: #f8ebd4;
      --danger: #9f1239;
      --bar: #1c1915;
      --bar-ink: #f6f1e6;
    }
    :root {
      --safe-top: calc(env(safe-area-inset-top, 0px) + 48px);
      --safe-bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Segoe UI", "PingFang HK", "Microsoft JhengHei", sans-serif;
      background: var(--paper);
      color: var(--ink);
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; touch-action: manipulation; }
    #app {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-top);
    }
    .view { flex: 1; display: flex; flex-direction: column; min-height: 0; padding-bottom: calc(80px + var(--safe-bottom)); }
    .pad { padding: 16px; padding-left: max(16px, var(--safe-left)); padding-right: max(16px, var(--safe-right)); }
    h1 { margin: 0 0 10px; font-size: 26px; line-height: 1.3; word-break: break-word; }
    .muted { color: var(--muted); line-height: 1.5; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip, .key, .step, .secondary, .primary, .add, .bar, .product, .line-card {
      border: 2px solid var(--line);
      background: var(--card);
      border-radius: 12px;
    }
    .chip {
      min-height: 44px;
      padding: 0 14px;
      border-radius: 999px;
      font-weight: 800;
    }
    .chip.on { background: var(--ink); color: var(--bar-ink); }
    .grid { display: flex; flex-wrap: wrap; gap: 12px; padding: 0 16px 16px; }
    .product { width: calc(50% - 6px); min-height: 148px; padding: 12px; text-align: left; position: relative; }
    .letter, .photo {
      height: 84px; border-radius: 10px; background: #e7e0d2;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: 800; overflow: hidden;
    }
    .photo { width: 100%; object-fit: cover; display: block; }
    .product .name { font-size: 18px; font-weight: 800; min-height: 48px; margin-top: 8px; }
    .price { color: var(--accent); font-size: 20px; font-weight: 800; }
    .badge {
      position: absolute; top: 8px; right: 8px; min-width: 32px; height: 32px;
      border-radius: 16px; background: var(--accent); color: var(--accent-ink);
      display: flex; align-items: center; justify-content: center; font-weight: 800;
    }
    .tag { display: inline-block; background: var(--warn-soft); color: var(--warn); font-size: 12px; font-weight: 800; border-radius: 6px; padding: 2px 6px; }
    .empty { padding: 24px; }
    .primary, .add {
      background: var(--accent); color: var(--accent-ink); border: 0; min-height: 52px;
      padding: 0 16px; font-weight: 800; border-radius: 12px;
    }
    .secondary { min-height: 48px; padding: 0 12px; font-weight: 800; background: var(--card); }
    .session .secondary { margin-top: 8px; width: 100%; }
    .danger { background: none; border: 0; color: var(--danger); font-weight: 800; min-height: 48px; }
    .tabs {
      position: fixed; left: 0; right: 0; bottom: 0;
      height: calc(64px + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
      display: flex; background: var(--card); border-top: 2px solid var(--line); z-index: 5;
    }
    .tabs button { flex: 1; border: 0; background: transparent; font-weight: 800; color: var(--muted); }
    .tabs button.on { color: var(--accent); }
    .bar {
      margin: 12px; min-height: 64px; background: var(--bar); color: var(--bar-ink);
      display: flex; align-items: center; justify-content: space-between; padding: 0 18px;
      font-size: 22px; font-weight: 800; width: calc(100% - 24px);
    }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0; top: 0;
      padding-top: var(--safe-top);
      background: var(--paper); z-index: 8;
      display: flex; flex-direction: column;
    }
    .sheet header, .side header {
      min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 8px 16px;
      padding-left: max(16px, var(--safe-left));
      padding-right: max(16px, var(--safe-right));
      border-bottom: 2px solid var(--line); background: var(--card);
    }
    .sheet header strong { font-size: 20px; }
    .close {
      position: relative; z-index: 2;
      flex: 0 0 auto;
      border: 2px solid var(--line); background: var(--card); color: var(--accent);
      min-width: 76px; min-height: 48px; padding: 0 14px;
      border-radius: 12px; font-weight: 800; font-size: 18px;
    }
    .link { border: 0; background: none; color: var(--accent); font-weight: 800; min-height: 44px; }
    .lines { flex: 1; overflow: auto; padding: 16px; }
    .line { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
    .line .meta { flex: 1; }
    .stepper { display: flex; align-items: center; gap: 6px; }
    .step { width: 44px; height: 44px; font-size: 22px; font-weight: 800; }
    .footer { padding: 12px; border-top: 2px solid var(--line); background: var(--paper); }
    .totals { display: flex; justify-content: space-between; font-weight: 800; margin: 4px 0; }
    .totals strong { font-size: 28px; }
    .change { color: var(--ok); font-size: 22px; }
    .notice { background: var(--ok-soft); color: var(--ok); font-weight: 800; padding: 10px; border-radius: 10px; }
    .problem { color: var(--danger); font-weight: 800; }
    .keys { display: grid; gap: 8px; margin-top: 8px; }
    .keys .keyrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .key { min-height: 52px; font-size: 22px; font-weight: 800; }
    .actions { display: flex; gap: 8px; margin-top: 8px; }
    .actions .secondary, .actions .primary { flex: 1; }
    label { font-weight: 800; display: block; margin-top: 12px; }
    input[type="text"], input[type="number"] {
      width: 100%; min-height: 52px; border: 2px solid var(--line); border-radius: 12px;
      background: var(--card); padding: 0 12px; font-size: 18px; font-weight: 700;
    }
    .card { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 12px; margin-top: 8px; }
    .side { display: none; }
    .banner { margin: 0 16px 8px; background: var(--warn-soft); color: var(--warn); font-weight: 800; padding: 10px; border-radius: 10px; }
    .session { margin-top: 16px; }
    .session h2 { margin: 0 0 4px; font-size: 20px; }
    .pill { display: inline-block; margin-left: 8px; background: var(--ok-soft); color: var(--ok); border-radius: 999px; padding: 2px 8px; font-size: 13px; }
    @media (min-width: 900px) {
      .product { width: calc(33.33% - 8px); }
      .sell-body { display: grid; grid-template-columns: 1fr 400px; min-height: 0; flex: 1; }
      .side { display: flex; flex-direction: column; border-left: 2px solid var(--line); min-height: 0; background: var(--card); }
      .phone-bar, .cart-sheet { display: none !important; }
      .view { padding-bottom: calc(80px + var(--safe-bottom)); }
      :root { --safe-top: calc(env(safe-area-inset-top, 0px) + 16px); }
    }
  </style>
</head>

    const SYMBOL = { HKD:"HK$", CNY:"¥", USD:"US$", MOP:"MOP$", TWD:"NT$", JPY:"JP¥", EUR:"€", GBP:"£", SGD:"S$", AUD:"A$", KRW:"₩", THB:"฿" };
    const I18N = {

cancel":"取消","delete":"刪除"}},
      "zh-Hans": {"appName":"摊位收银","offline":"数据只存在这台设备，没有网络也能收银。","tabs":{"sell":"收银","products":"货品","sales":"销售","settings":"设置"},"currency":{"HKD":"港币","CNY":"人民币","USD":"美元","MOP":"澳门币","TWD":"新台币","JPY":"日元","EUR":"欧元","GBP":"英镑","SGD":"新加坡元","AUD":"澳元","KRW":"韩元","THB":"泰铢"},"sell":{"emptyTitle":"还没有货品","emptyBody":"先加入货品和价格，摊位上一点就能入单。","goProducts":"去新增货品"},"price":{"missing":"未定价","needRate":"未设汇率","converted":"换算"},"cart":{"title":"本单","empty":"还没有点选货品","clear":"清空本单","checkout":"入账","total":"合计","tendered":"实收","change":"找零","exact":"实收刚好","insufficient":"实收少于合计","needTendered":"请输入实收金额","close":"关闭","confirmClear":"清空这一单？","checkedOut":"已入账，找零 {{change}}","missingPrice":"{{name}} 没有这个币别的价格","missingRate":"请先在设置填写{{currency}}汇率","cannotAdd":"这件货品现在不能用{{currency}}结账"},"product":{"new":"新增货品","edit":"编辑货品","name":"名称","namePlaceholder":"例如：贴纸、小卡","prices":"各币别价格","priceHint":"留空代表这个币别没有自己的标价。结账时会用港币价，再按你设置的汇率换算。","image":"照片","pickImage":"选择照片","removeImage":"移除照片","save":"保存","delete":"删除货品","deleteConfirm":"删除后不能还原。已入账的销售记录会保留。","nameRequired":"请填写名称","priceInvalid":"价格格式不正确"},"products":{"empty":"尚未登记货品","add":"新增货品"},"sales":{"title":"摆摊记录","empty":"这一档还没有入账","hint":"每一档分开列出合计和单据。","totals":"各币别合计","quantities":"货品销量","receipts":"单据","change":"找零 {{amount}}","qty":"{{count}} 件"},"session":{"new":"开新一档","confirmNew":"结束这一档。之后的入账会计入新的一档，这一档的单据会留在列表里。","current":"进行中","unnamed":"未命名摊位","empty":"这一档还没有入账"},"pdf":{"session":"导出这一档 PDF","receipt":"导出这张单据","sessionTitle":"摆摊总单","receiptTitle":"单据","received":"实收","hint":"会生成 PDF。手机请在分享画面选择“存储到文件”。","failed":"PDF 未能生成，请再试一次"},"settings":{"stallName":"摊位名称","stallPlaceholder":"例如：周末市集","saveName":"保存名称","nameSaved":"已保存摊位名称","language":"语言","currencies":"结账币别","baseHint":"港币是标价基准，不能关闭。其他币别可以各自标价；没有标价时，用下面的汇率从港币换算。","rateTitle":"手动汇率","rateHint":"汇率由你自己填写，不会联网抓实时价。填写 100 港币可以换成多少。","per100":"100 港币 =","saveRate":"保存","clearRate":"清除","rateInvalid":"请输入大于 0 的金额","rateSaved":"已保存","rateCleared":"已清除"},"common":{"cancel":"取消","delete":"删除"}},
      "en": {"appName":"Stall POS","offline":"Data stays on this device. Checkout works without a network.","tabs":{"sell":"Sell","products":"Items","sales":"Sales","settings":"Settings"},"currency":{"HKD":"HKD","CNY":"CNY","USD":"USD","MOP":"MOP","TWD":"TWD","JPY":"JPY","EUR":"EUR","GBP":"GBP","SGD":"SGD","AUD":"AUD","KRW":"KRW","THB":"THB"},"sell":{"emptyTitle":"No items yet","emptyBody":"Add items and prices, then tap them at the stall to build an order.","goProducts":"Add an item"},"price":{"missing":"No price","needRate":"No rate","converted":"Converted"},"cart":{"title":"This order","empty":"Nothing selected yet","clear":"Clear order","checkout":"Save sale","total":"Total","tendered":"Received","change":"Change","exact":"Exact amount","insufficient":"Received is less than the total","needTendered":"Enter the amount received","close":"Close","confirmClear":"Clear this order?","checkedOut":"Saved. Change {{change}}","missingPrice":"{{name}} has no price in this currency","missingRate":"Set a {{currency}} rate in Settings first","cannotAdd":"This item cannot be charged in {{currency}} yet"},"product":{"new":"New item","edit":"Edit item","name":"Name","namePlaceholder":"e.g. sticker, print","prices":"Prices by currency","priceHint":"Leave a currency blank if it has no own price. Checkout will convert the HKD price with your rate.","image":"Photo","pickImage":"Choose photo","removeImage":"Remove photo","save":"Save","delete":"Delete item","deleteConfirm":"This cannot be undone. Sales already recorded stay in the report.","nameRequired":"Enter a name","priceInvalid":"That price format is not valid"},"products":{"empty":"No items yet","add":"New item"},"sales":{"title":"Stall records","empty":"No sales in this stall yet","hint":"Each stall keeps its own totals and receipts.","totals":"Totals by currency","quantities":"Quantity sold","receipts":"Receipts","change":"Change {{amount}}","qty":"{{count}}"},"session":{"new":"Start a new stall","confirmNew":"End this stall. Later sales go to the new one. These receipts stay in the list.","current":"In progress","unnamed":"Unnamed stall","empty":"No sales in this stall yet"},"pdf":{"session":"Export this stall as PDF","receipt":"Export this receipt","sessionTitle":"Stall summary","receiptTitle":"Receipt","received":"Received","hint":"Creates a PDF. On a phone, choose Save to Files in the share sheet.","failed":"Could not create the PDF. Try again."},"settings":{"stallName":"Stall name","stallPlaceholder":"e.g. weekend market","saveName":"Save name","nameSaved":"Stall name saved","language":"Language","currencies":"Checkout currencies","baseHint":"HKD is the base price and stays on. Other currencies can have their own prices. If a price is missing, the rate below converts from HKD.","rateTitle":"Manual rates","rateHint":"You type the rate. The app does not fetch a live rate. Enter how much 100 HKD converts to.","per100":"100 HKD =","saveRate":"Save","clearRate":"Clear","rateInvalid":"Enter an amount greater than 0","rateSaved":"Saved","rateCleared":"Cleared"},"common":{"cancel":"Cancel","delete":"Delete"}}
    };

    const KEY = "stall-pos-html-v1";
    const state = load();
    let tab = "sell";
    let cartOpen = false;
    let tendered = "";
    let notice = "";
    let banner = "";
    let editor = null;
    let rateNote = "";
    let nameNote = "";
    let pdfNote = "";

    function blankState() {
      return {
        products: [],
        cart: [],
        sales: [],
        sessions: [],
        settings: { language: "zh-Hant", enabled: ["HKD", "CNY"], rates: {}, pay: "HKD", stallName: "" }
      };
    }
    function normalize(data) {
      data.products = data.products || [];
      data.cart = data.cart || [];
      data.sales = data.sales || [];
      data.settings = data.settings || blankState().settings;
      if (typeof data.settings.stallName !== "string") data.settings.stallName = "";
      if (!Array.isArray(data.sessions)) data.sessions = [];
      if (!data.sessions.length) {
        const times = data.sales.map((sale) => sale.createdAt).filter(Boolean);
        data.sessions.push({
          id: crypto.randomUUID(),
          name: data.settings.stallName,
          startedAt: times.length ? Math.min(...times) : Date.now(),
          closedAt: null
        });
      }
      let open = data.sessions.find((session) => !session.closedAt);
      if (!open) {
        open = { id: crypto.randomUUID(), name: data.settings.stallName, startedAt: Date.now(), closedAt: null };
        data.sessions.unshift(open);
      }
      for (const sale of data.sales) if (!sale.sessionId) sale.sessionId = open.id;
      return data;
    }
    function load() {
      try {
        const saved = JSON.parse(localStorage.getItem(KEY) || "null");
        if (saved && saved.settings) return normalize(saved);
      } catch {}
      return normalize(blankState());
    }
    function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
    function t(path, vars) {
      const parts = path.split(".");
      let value = I18N[state.settings.language];
      for (const part of parts) value = value?.[part];
      let text = value ?? path;
      if (vars) for (const [key, val] of Object.entries(vars)) text = text.replaceAll(`{{${key}}}`, val);
      return text;
    }
    function esc(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch]));
    }
    function per100(code) { return 100 * 10 ** EXPONENT[code]; }
    function divRound(n, d) {
      const neg = (n < 0) !== (d < 0);
      const an = Math.abs(n), ad = Math.abs(d);
      const q = Math.floor(an / ad);
      const r = an % ad;
      const rounded = r * 2 >= ad ? q + 1 : q;
      return neg ? -rounded : rounded;
    }
    function parseMajor(input, exponent) {
      const trimmed = String(input).trim().replace(/,/g, "");
      if (!trimmed || !/^\d+(\.\d+)?$/.test(trimmed)) return null;
      const [whole, frac = ""] = trimmed.split(".");
      if (frac.length > exponent) return null;
      const minor = Number(whole) * 10 ** exponent + Number(frac.padEnd(exponent, "0") || 0);
      return Number.isSafeInteger(minor) ? minor : null;
    }
    function minorInput(amount, exponent) {
      const factor = 10 ** exponent;
      const whole = Math.floor(amount / factor);
      const frac = amount % factor;
      return exponent === 0 ? String(whole) : `${whole}.${String(frac).padStart(exponent, "0")}`;
    }
    function formatMinor(amount, currency) {
      const exponent = EXPONENT[currency];
      const abs = Math.abs(amount);
      const factor = 10 ** exponent;
      const locale = state.settings.language === "zh-Hans" ? "zh-CN" : state.settings.language === "en" ? "en-HK" : "zh-HK";
      const whole = new Intl.NumberFormat(locale, { maximumFractionDigits: 0 }).format(Math.floor(abs / factor));
      const body = exponent === 0 ? whole : `${whole}.${String(abs % factor).padStart(exponent, "0")}`;
      return `${amount < 0 ? "-" : ""}${SYMBOL[currency]}${body}`;
    }
    function convert(amount, from, to) {
      if (from === to) return amount;
      const rates = state.settings.rates;
      const toHkd = from === "HKD" ? amount : divRound(amount * per100("HKD"), rates[from]);
      return to === "HKD" ? toHkd : divRound(toHkd * rates[to], per100("HKD"));
    }
    function resolve(prices, pay) {
      if (prices[pay] !== undefined) return { unit: prices[pay], converted: false };
      if (prices.HKD === undefined) return { error: "missing-price" };
      if (pay !== "HKD" && !state.settings.rates[pay]) return { error: "missing-rate" };
      return { unit: convert(prices.HKD, "HKD", pay), converted: pay !== "HKD" };
    }
    function quote() {
      const pay = state.settings.pay;
      const lines = [];
      let total = 0;
      for (const item of state.cart) {
        const product = state.products.find((row) => row.id === item.productId);
        if (!product || item.quantity <= 0) continue;
        const resolved = resolve(product.prices, pay);
        if (resolved.error) return { ok: false, error: resolved.error, name: product.name };
        const line = resolved.unit * item.quantity;
        total += line;
        lines.push({ product, quantity: item.quantity, unit: resolved.unit, line, converted: resolved.converted });
      }
      if (!lines.length) return { ok: false, error: "empty" };
      return { ok: true, lines, total, pay };
    }
    function appendDigit(current, key) {
      const exponent = EXPONENT[state.settings.pay];
      if (key === "back") return current.slice(0, -1);
      if (key === "clear") return "";
      let next = current;
      if (key === ".") {
        if (exponent === 0 || current.includes(".")) return current;
        next = current ? `${current}.` : "0.";
      } else if (key === "00") next = !current || current === "0" ? "0" : `${current}00`;
      else next = current === "0" ? key : `${current}${key}`;
      const [whole, frac = ""] = next.split(".");
      if (whole.length > 7 || frac.length > exponent) return current;
      return next;
    }
    function qtyOf(id) { return state.cart.find((row) => row.productId === id)?.quantity || 0; }
    function setQty(id, quantity) {
      state.cart = state.cart.filter((row) => row.productId !== id);
      if (quantity > 0) state.cart.push({ productId: id, quantity: Math.min(999, quantity) });
      save();
    }
    function addProduct(id) {
      const product = state.products.find((row) => row.id === id);
      const resolved = resolve(product.prices, state.settings.pay);
      if (resolved.error) {
        banner = resolved.error === "missing-rate"
          ? t("cart.missingRate", { currency: t(`currency.${state.settings.pay}`) })
          : t("cart.cannotAdd", { currency: t(`currency.${state.settings.pay}`) });
        render();
        return;
      }
      banner = "";
      setQty(id, qtyOf(id) + 1);
      render();
    }
    function checkout() {
      const bill = quote();
      if (!bill.ok) return;
      const paid = parseMajor(tendered, EXPONENT[bill.pay]);
      if (paid === null) { notice = t("cart.needTendered"); render(); return; }
      if (paid < bill.total) { notice = t("cart.insufficient"); render(); return; }
      const change = paid - bill.total;
      const session = openSession();
      state.sales.unshift({
        id: crypto.randomUUID(),
        sessionId: session.id,
        createdAt: Date.now(),
        pay: bill.pay,
        total: bill.total,
        change,
        lines: bill.lines.map((line) => ({ name: line.product.name, id: line.product.id, quantity: line.quantity }))
      });
      state.cart = [];
      tendered = "";
      notice = t("cart.checkedOut", { change: formatMinor(change, bill.pay) });
      save();
      render();
    }
    function openSession() {
      let session = state.sessions.find((item) => !item.closedAt);
      if (!session) {
        session = { id: crypto.randomUUID(), name: state.settings.stallName.trim(), startedAt: Date.now(), closedAt: null };
        state.sessions.unshift(session);
      }
      return session;
    }
    function startNewSession() {
      if (!confirm(t("session.confirmNew"))) return;
      const current = state.sessions.find((item) => !item.closedAt);
      if (current) current.closedAt = Date.now();
      state.sessions.unshift({
        id: crypto.randomUUID(),
        name: state.settings.stallName.trim(),
        startedAt: Date.now(),
        closedAt: null
      });
      nameNote = "";
      save();
      render();
    }

    function cartMarkup(closable) {
      const bill = quote();
      const pay = state.settings.pay;
      const paid = parseMajor(tendered, EXPONENT[pay]);
      const change = bill.ok && paid !== null && paid >= bill.total ? formatMinor(paid - bill.total, pay) : "—";
      const problem = !bill.ok && bill.error === "missing-price"
        ? t("cart.missingPrice", { name: bill.name })
        : !bill.ok && bill.error === "missing-rate"
          ? t("cart.missingRate", { currency: t(`currency.${pay}`) })
          : paid !== null && bill.ok && paid < bill.total ? t("cart.insufficient") : "";
      const rows = bill.ok ? bill.lines : state.cart.flatMap((item) => {
        const product = state.products.find((row) => row.id === item.productId);
        return product ? [{ product, quantity: item.quantity, line: null, converted: false }] : [];
      });
      const keys = [["1","2","3","back"],["4","5","6","clear"],["7","8","9","00"],[".","0"]];
      return `
        <header><strong>${t("cart.title")}</strong>${closable ? `<button class="close" data-action="close-cart">${t("cart.close")}</button>` : ""}</header>
        <div class="lines">
          ${rows.length ? rows.map((row) => `
            <div class="line">
              <div class="meta"><div><strong>${esc(row.product.name)}</strong></div><div class="muted">${row.line === null ? "—" : formatMinor(row.line, pay)}${row.converted ? ` · ${t("price.converted")}` : ""}</div></div>
              <div class="stepper">
                <button class="step" data-action="qty" data-id="${row.product.id}" data-delta="-1">−</button>
                <strong>${row.quantity}</strong>
                <button class="step" data-action="qty" data-id="${row.product.id}" data-delta="1">+</button>
              </div>
            </div>`).join("") : `<p class="muted">${t("cart.empty")}</p>`}
        </div>
        <div class="footer">
          ${notice ? `<div class="notice">${esc(notice)}</div>` : ""}
          ${problem ? `<div class="problem">${esc(problem)}</div>` : ""}
          <div class="totals"><span>${t("cart.total")}</span><strong>${bill.ok ? formatMinor(bill.total, pay) : "—"}</strong></div>
          <div class="totals"><span>${t("cart.tendered")}</span><span>${esc(tendered || "—")}</span></div>
          <div class="totals"><span>${t("cart.change")}</span><span class="change">${change}</span></div>
          <button class="link" data-action="exact">${t("cart.exact")}</button>
          <div class="keys">
            ${keys.map((row) => `<div class="keyrow">${row.map((key) => key === "." && EXPONENT[pay] === 0 ? "<span></span>" : `<button class="key" data-action="key" data-key="${key}">${key === "back" ? "⌫" : key === "clear" ? "C" : key}</button>`).join("")}</div>`).join("")}
          </div>
          <div class="actions">
            <button class="secondary" data-action="clear">${t("cart.clear")}</button>
            <button class="primary" data-action="checkout" ${bill.ok ? "" : "disabled"}>${t("cart.checkout")}</button>
          </div>
        </div>`;
    }

    function sellView() {
      const bill = quote();
      const count = state.cart.reduce((sum, row) => sum + row.quantity, 0);
      const cards = state.products.map((product) => {
        const resolved = resolve(product.prices, state.settings.pay);
        const label = resolved.error ? t(resolved.error === "missing-rate" ? "price.needRate" : "price.missing") : formatMinor(resolved.unit, state.settings.pay);
        const photo = product.image ? `<img class="photo" alt="" src="${esc(product.image)}" />` : `<div class="letter">${esc(product.name.slice(0, 1))}</div>`;
        return `<button class="product" data-action="add" data-id="${product.id}">${photo}<div class="name">${esc(product.name)}</div><div class="price">${esc(label)}</div>${resolved.converted ? `<span class="tag">${t("price.converted")}</span>` : ""}${qtyOf(product.id) ? `<span class="badge">${qtyOf(product.id)}</span>` : ""}</button>`;
      }).join("");
      return `<section class="view sell">
        <div class="sell-body">
          <div>
            <div class="pad"><h1>${esc(state.settings.stallName.trim() || t("appName"))}</h1>${state.settings.stallName.trim() ? `<p class="muted">${esc(t("appName"))}</p>` : ""}<div class="chips">${state.settings.enabled.map((code) => `<button class="chip ${code === state.settings.pay ? "on" : ""}" data-action="pay" data-code="${code}">${t(`currency.${code}`)}</button>`).join("")}</div></div>
            ${banner ? `<div class="banner">${esc(banner)}</div>` : ""}
            ${state.products.length ? `<div class="grid">${cards}</div>` : `<div class="empty"><h2>${t("sell.emptyTitle")}</h2><p class="muted">${t("sell.emptyBody")}</p><button class="primary" data-action="tab" data-tab="products">${t("sell.goProducts")}</button></div>`}
            <button class="bar phone-bar" data-action="open-cart"><span>${count}</span><span>${bill.ok ? formatMinor(bill.total, bill.pay) : t("cart.title")}</span></button>
          </div>

    function productsView() {
      const rows = state.products.map((product) => {
        const prices = Object.entries(product.prices).map(([code, amount]) => formatMinor(amount, code)).join("  ·  ");
        return `<button class="card" data-action="edit" data-id="${product.id}" style="width:100%;text-align:left"><strong>${esc(product.name)}</strong><div class="muted">${esc(prices || t("price.missing"))}</div></button>`;
      }).join("");
      return `<section class="view"><div class="pad row"><h1>${t("tabs.products")}</h1><button class="add" data-action="new">${t("products.add")}</button></div><div class="pad">${rows || `<p class="muted">${t("products.empty")}</p>`}</div>${editor ? editorMarkup() : ""}</section>`;
    }

    function editorMarkup() {
      const draft = editor;
      return `<div class="sheet editor-sheet"><header><strong>${draft.id ? t("product.edit") : t("product.new")}</strong><button class="close" data-action="close-editor">${t("cart.close")}</button></header>
        <div class="lines">
          <label>${t("product.name")}</label>
          <input id="product-name" type="text" value="${esc(draft.name)}" placeholder="${esc(t("product.namePlaceholder"))}" />

          <input id="product-file" type="file" accept="image/*" hidden />
          <label>${t("product.prices")}</label>
          <p class="muted">${t("product.priceHint")}</p>
          ${state.settings.enabled.map((code) => `<label>${t(`currency.${code}`)}</label><input data-price="${code}" type="text" inputmode="decimal" value="${esc(draft.prices[code] ?? "")}" placeholder="${EXPONENT[code] ? "0.00" : "0"}" />`).join("")}
          ${draft.error ? `<p class="problem">${esc(draft.error)}</p>` : ""}
          <button class="primary" data-action="save-product" style="width:100%;margin-top:16px">${t("product.save")}</button>
          ${draft.id ? `<button class="danger" data-action="delete-product">${t("product.delete")}</button>` : ""}
        </div></div>`;
    }

    const PDF_W = 1240;
    const PDF_H = 1754;
    const PDF_MARGIN = 72;
    const PDF_FONT = '"PingFang HK", "Microsoft JhengHei", "Segoe UI", sans-serif';

    function dateLocale() {
      return state.settings.language === "zh-Hans" ? "zh-CN" : state.settings.language === "en" ? "en-HK" : "zh-HK";
    }
    function formatWhen(ts) {
      return new Intl.DateTimeFormat(dateLocale(), { year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }).format(ts);
    }
    function pdfFileName(label) {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      const stamp = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}`;
      const safe = String(label || "stall").replace(/[\\/:*?"<>|\u0000-\u001f]/g, "").trim().slice(0, 40) || "stall";
      return `${safe}-${stamp}.pdf`;
    }
    function sessionSales(sessionId) {
      return state.sales.filter((sale) => sale.sessionId === sessionId).sort((a, b) => a.createdAt - b.createdAt);
    }
    function summarize(sales) {
      const totals = {};
      const qty = {};
      for (const sale of sales) {
        totals[sale.pay] = (totals[sale.pay] || 0) + sale.total;
        for (const line of sale.lines) {
          qty[line.id] = qty[line.id] || { name: line.name, count: 0 };
          qty[line.id].count += line.quantity;
          qty[line.id].name = line.name;
        }
      }
      return { totals, qty };
    }
    function sessionPdf(sessionId) {
      const session = state.sessions.find((item) => item.id === sessionId);
      if (!session) return null;
      const sales = sessionSales(session.id);
      const { totals, qty } = summarize(sales);
      const title = session.name.trim() || t("session.unnamed");
      const range = `${formatWhen(session.startedAt)}${session.closedAt ? ` – ${formatWhen(session.closedAt)}` : ""}`;
      const lines = [
        { text: title, size: 52, weight: 800, gap: 6 },
        { text: t("pdf.sessionTitle"), size: 28, weight: 700, color: "#5e584e", gap: 4 },
        { text: range, size: 26, weight: 600, color: "#5e584e", gap: 8 },
        { rule: true }
      ];
      lines.push({ text: t("sales.totals"), size: 30, weight: 800, gap: 6 });
      const totalEntries = Object.entries(totals);
      if (!totalEntries.length) lines.push({ text: "—", size: 28, weight: 700, gap: 8 });
      for (const [code, amount] of totalEntries) lines.push({ left: t(`currency.${code}`), right: formatMinor(amount, code), size: 32, weight: 800, color: "#c2410c", gap: 4 });
      lines.push({ text: t("sales.quantities"), size: 30, weight: 800, gap: 6 });
      const items = Object.values(qty);
      if (!items.length) lines.push({ text: "—", size: 28, weight: 700, gap: 8 });
      for (const item of items) lines.push({ left: item.name, right: t("sales.qty", { count: item.count }), size: 28, weight: 700, gap: 4 });
      lines.push({ rule: true });
      lines.push({ text: t("sales.receipts"), size: 30, weight: 800, gap: 8 });
      if (!sales.length) lines.push({ text: t("session.empty"), size: 26, weight: 600, color: "#5e584e" });
      sales.forEach((sale, index) => lines.push(...receiptLines(sale, index + 1)));
      return { lines, filename: pdfFileName(title) };
    }
    function salePdf(saleId) {
      const sale = state.sales.find((item) => item.id === saleId);
      if (!sale) return null;
      const session = state.sessions.find((item) => item.id === sale.sessionId);
      const title = session?.name.trim() || state.settings.stallName.trim() || t("session.unnamed");
      return { lines: [{ text: title, size: 48, weight: 800, gap: 6 }, { text: t("pdf.receiptTitle"), size: 28, weight: 700, color: "#5e584e", gap: 8 }, { rule: true }, ...receiptLines(sale, 1)], filename: pdfFileName(`${t("pdf.receiptTitle")}-${title}`) };
    }
    function receiptLines(sale, index) {
      const lines = [
        { text: `${index}. ${formatWhen(sale.createdAt)}`, size: 26, weight: 800, gap: 6 }
      ];
      for (const line of sale.lines) lines.push({ left: line.name, right: `× ${line.quantity}`, size: 26, weight: 600, gap: 2 });
      lines.push({ left: t("cart.total"), right: formatMinor(sale.total, sale.pay), size: 28, weight: 800, gap: 2 });
      lines.push({ left: t("pdf.received"), right: formatMinor(sale.total + sale.change, sale.pay), size: 26, weight: 700, gap: 2 });
      lines.push({ left: t("cart.change"), right: formatMinor(sale.change, sale.pay), size: 26, weight: 700, color: "#145c45", gap: 16 });
      return lines;
    }
    function wrapText(ctx, text, maxWidth) {
      const out = [];
      let current = "";
      for (const ch of String(text)) {
        if (ch === "\n") { out.push(current); current = ""; continue; }
        const trial = current + ch;
        if (current && ctx.measureText(trial).width > maxWidth) { out.push(current); current = ch; }
        else current = trial;
      }
      if (current || !out.length) out.push(current);
      return out;
    }
    function drawPdfPages(lines) {
      const pages = [];
      let canvas;
      let ctx;
      let y = 0;
      function blank() {
        if (canvas) pages.push(canvas);
        canvas = document.createElement("canvas");
        canvas.width = PDF_W;
        canvas.height = PDF_H;
        ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fffdf8";
        ctx.fillRect(0, 0, PDF_W, PDF_H);
        ctx.textBaseline = "top";
        y = PDF_MARGIN;
      }
      function ensure(height) {
        if (y + height > PDF_H - PDF_MARGIN) blank();
      }
      blank();
      for (const line of lines) {
        if (line.rule) {
          ensure(20);
          ctx.strokeStyle = "#1c1915";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(PDF_MARGIN, y + 8);
          ctx.lineTo(PDF_W - PDF_MARGIN, y + 8);
          ctx.stroke();
          y += 28;
          continue;
        }
        const size = line.size || 28;
        const lh = Math.round(size * 1.4);
        ctx.font = `${line.weight || 700} ${size}px ${PDF_FONT}`;
        ctx.fillStyle = line.color || "#1c1915";
        if (line.right !== undefined) {
          ensure(lh);
          const right = String(line.right);
          const rightWidth = ctx.measureText(right).width;
          const leftWidth = PDF_W - PDF_MARGIN * 2 - rightWidth - 24;
          const parts = wrapText(ctx, line.left, leftWidth);
          parts.forEach((part, index) => {
            if (index) ensure(lh);
            ctx.fillStyle = line.color || "#1c1915";
            ctx.fillText(part, PDF_MARGIN, y);
            if (index === 0) ctx.fillText(right, PDF_W - PDF_MARGIN - rightWidth, y);
            y += lh;
          });
          y += line.gap ?? 8;
          continue;
        }
        const parts = wrapText(ctx, line.text, PDF_W - PDF_MARGIN * 2);
        for (const part of parts) {
          ensure(lh);
          ctx.font = `${line.weight || 700} ${size}px ${PDF_FONT}`;
          ctx.fillStyle = line.color || "#1c1915";
          ctx.fillText(part, PDF_MARGIN, y);
          y += lh;
        }
        y += line.gap ?? 8;
      }
      pages.push(canvas);
      return pages;
    }
    function canvasJpeg(canvas) {
      const binary = atob(canvas.toDataURL("image/jpeg", 0.92).split(",")[1]);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }
    function pdfBytes(pages) {
      const ascii = (value) => new TextEncoder().encode(value);
      const chunks = [];
      let length = 0;
      const offsets = [];
      function add(bytes) {
        chunks.push(bytes);
        length += bytes.length;
      }
      function addText(value) { add(ascii(value)); }
      addText("%PDF-1.4\n");
      const ids = pages.map((_, index) => ({ page: 3 + index * 3, content: 4 + index * 3, image: 5 + index * 3 }));
      const count = 3 + pages.length * 3;
      function start(id) { offsets[id] = length; }
      start(1);
      addText("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
      start(2);
      addText(`2 0 obj\n<< /Type /Pages /Kids [${ids.map((id) => `${id.page} 0 R`).join(" ")}] /Count ${pages.length} >>\nendobj\n`);
      pages.forEach((jpeg, index) => {
        const id = ids[index];
        const content = `q 595.28 0 0 841.89 0 0 cm /Im${index} Do Q\n`;
        start(id.page);
        addText(`${id.page} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Contents ${id.content} 0 R /Resources << /XObject << /Im${index} ${id.image} 0 R >> >> >>\nendobj\n`);
        start(id.content);
        addText(`${id.content} 0 obj\n<< /Length ${content.length} >>\nstream\n${content}endstream\nendobj\n`);
        start(id.image);
        addText(`${id.image} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${PDF_W} /Height ${PDF_H} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`);
        add(jpeg);
        addText("\nendstream\nendobj\n");
      });
      const xrefAt = length;
      let xref = `xref\n0 ${count}\n0000000000 65535 f \n`;
      for (let id = 1; id < count; id += 1) xref += `${String(offsets[id]).padStart(10, "0")} 00000 n \n`;
      xref += `trailer\n<< /Size ${count} /Root 1 0 R >>\nstartxref\n${xrefAt}\n%%EOF`;
      addText(xref);
      const out = new Uint8Array(length);
      let cursor = 0;
      for (const chunk of chunks) { out.set(chunk, cursor); cursor += chunk.length; }
      return out;
    }
    function shareOrSave(bytes, filename) {
      const file = new File([bytes], filename, { type: "application/pdf" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: filename }).catch((error) => {
          if (error && error.name === "AbortError") return;
          savePdfFile(file);
        });
        return;
      }
      savePdfFile(file);
    }
    function savePdfFile(file) {
      const url = URL.createObjectURL(file);
      const link = document.createElement("a");
      link.href = url;
      link.download = file.name;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }
    function exportPdf(kind, id) {
      try {
        pdfNote = "";
        const doc = kind === "session" ? sessionPdf(id) : salePdf(id);
        if (!doc) return;
        const pages = drawPdfPages(doc.lines).map(canvasJpeg);
        shareOrSave(pdfBytes(pages), doc.filename);
      } catch {
        pdfNote = t("pdf.failed");
        render();
      }
    }

    function salesView() {
      const locale = state.settings.language === "zh-Hans" ? "zh-CN" : state.settings.language === "en" ? "en-HK" : "zh-HK";
      const when = new Intl.DateTimeFormat(locale, { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
      const sessions = [...state.sessions].sort((a, b) => b.startedAt - a.startedAt);
      const blocks = sessions.map((session) => {
        const sales = state.sales.filter((sale) => sale.sessionId === session.id);
        const totals = {};
        const qty = {};
        for (const sale of sales) {
          totals[sale.pay] = (totals[sale.pay] || 0) + sale.total;
          for (const line of sale.lines) {
            qty[line.id] = qty[line.id] || { name: line.name, count: 0 };
            qty[line.id].count += line.quantity;
            qty[line.id].name = line.name;
          }
        }
        const title = session.name.trim() || t("session.unnamed");
        return `<article class="card session">
          <h2>${esc(title)}${session.closedAt ? "" : `<span class="pill">${t("session.current")}</span>`}</h2>
          <p class="muted">${when.format(session.startedAt)}${session.closedAt ? ` – ${when.format(session.closedAt)}` : ""}</p>
          <button class="secondary" data-action="pdf-session" data-id="${session.id}">${t("pdf.session")}</button>
          ${sales.length ? "" : `<p class="muted">${t("session.empty")}</p>`}
          <h3 class="muted">${t("sales.totals")}</h3>
          ${Object.entries(totals).map(([code, amount]) => `<div class="totals"><strong>${formatMinor(amount, code)}</strong></div>`).join("") || "<p>—</p>"}
          <h3 class="muted">${t("sales.quantities")}</h3>
          ${Object.values(qty).map((item) => `<div class="row"><span>${esc(item.name)}</span><strong>${esc(t("sales.qty", { count: item.count }))}</strong></div>`).join("") || "<p>—</p>"}
          <h3 class="muted">${t("sales.receipts")}</h3>
          ${sales.map((sale) => `<div class="card"><div class="row"><span>${when.format(sale.createdAt)}</span><strong>${formatMinor(sale.total, sale.pay)}</strong></div><div class="muted">${esc(t("sales.change", { amount: formatMinor(sale.change, sale.pay) }))}</div>${sale.lines.map((line) => `<div class="muted">${esc(line.name)} × ${line.quantity}</div>`).join("")}<button class="secondary" data-action="pdf-sale" data-id="${sale.id}">${t("pdf.receipt")}</button></div>`).join("") || "<p>—</p>"}
        </article>`;
      }).join("");
      return `<section class="view"><div class="pad"><h1>${t("sales.title")}</h1>
        <p class="muted">${t("sales.hint")}</p>
        <p class="muted">${t("pdf.hint")}</p>
        ${pdfNote ? `<p class="problem">${esc(pdfNote)}</p>` : ""}
        <button class="primary" data-action="new-session">${t("session.new")}</button>
        ${blocks}
      </div></section>`;
    }

    function settingsView() {
      return `<section class="view"><div class="pad"><h1>${t("tabs.settings")}</h1><p class="muted">${t("offline")}</p>
        <h2>${t("settings.stallName")}</h2>
        ${nameNote ? `<p class="notice">${esc(nameNote)}</p>` : ""}
        <input id="stall-name" type="text" value="${esc(state.settings.stallName)}" placeholder="${esc(t("settings.stallPlaceholder"))}" />
        <button class="primary" data-action="save-name" style="width:100%;margin-top:8px">${t("settings.saveName")}</button>
        <h2>${t("settings.language")}</h2>
        <div class="chips">
          ${[["zh-Hant","繁體中文"],["zh-Hans","简体中文"],["en","English"]].map(([code, label]) => `<button class="chip ${state.settings.language === code ? "on" : ""}" data-action="lang" data-code="${code}">${label}</button>`).join("")}
        </div>
        <h2>${t("settings.currencies")}</h2>
        <p class="muted">${t("settings.baseHint")}</p>
        <div class="chips">${CURRENCY_CODES.map((code) => `<button class="chip ${state.settings.enabled.includes(code) ? "on" : ""}" data-action="toggle" data-code="${code}">${t(`currency.${code}`)}</button>`).join("")}</div>
        <h2>${t("settings.rateTitle")}</h2>
        <p class="muted">${t("settings.rateHint")}</p>
        ${rateNote ? `<p class="notice">${esc(rateNote)}</p>` : ""}
        ${state.settings.enabled.filter((code) => code !== "HKD").map((code) => `<div class="card"><div>${t("settings.per100")} ${t(`currency.${code}`)}</div><input data-rate="${code}" type="text" inputmode="decimal" value="${esc(state.settings.rates[code] ? minorInput(state.settings.rates[code], EXPONENT[code]) : "")}" placeholder="${EXPONENT[code] ? "0.00" : "0"}" /><div class="actions"><button class="primary" data-action="save-rate" data-code="${code}">${t("settings.saveRate")}</button><button class="secondary" data-action="clear-rate" data-code="${code}">${t("settings.clearRate")}</button></div></div>`).join("")}
      </div></section>`;
    }

    function tabs() {
      return `<nav class="tabs">${["sell","products","sales","settings"].map((name) => `<button class="${tab === name ? "on" : ""}" data-action="tab" data-tab="${name}">${t(`tabs.${name}`)}</button>`).join("")}</nav>`;
    }

    function render() {
      const body = tab === "sell" ? sellView() : tab === "products" ? productsView() : tab === "sales" ? salesView() : settingsView();
      document.getElementById("app").innerHTML = body + tabs();
      document.title = t("appName");
      document.documentElement.lang = state.settings.language;
    }

    document.body.addEventListener("click", (event) => {
      const node = event.target.closest("[data-action]");
      if (!node) return;
      const action = node.dataset.action;
      if (action === "tab") { tab = node.dataset.tab; cartOpen = false; editor = null; render(); }
      if (action === "pay") { state.settings.pay = node.dataset.code; tendered = ""; notice = ""; save(); render(); }
      if (action === "add") addProduct(node.dataset.id);
      if (action === "open-cart") { cartOpen = true; render(); }
      if (action === "close-cart") { cartOpen = false; render(); }
      if (action === "qty") { setQty(node.dataset.id, qtyOf(node.dataset.id) + Number(node.dataset.delta)); render(); }
      if (action === "key") { tendered = appendDigit(tendered, node.dataset.key); notice = ""; render(); }
      if (action === "exact") {
        const bill = quote();
        if (bill.ok) tendered = minorInput(bill.total, EXPONENT[bill.pay]);
        render();
      }
      if (action === "clear") {
        if (confirm(t("cart.confirmClear"))) { state.cart = []; tendered = ""; notice = ""; save(); render(); }
      }
      if (action === "checkout") checkout();
      if (action === "new") { editor = { id: "", name: "", image: "", prices: {}, error: "" }; render(); }
      if (action === "edit") {
        const product = state.products.find((row) => row.id === node.dataset.id);
        const prices = {};
        for (const code of state.settings.enabled) if (product.prices[code] !== undefined) prices[code] = minorInput(product.prices[code], EXPONENT[code]);
        editor = { id: product.id, name: product.name, image: product.image || "", prices, error: "" };
        render();
      }
      if (action === "close-editor") { editor = null; render(); }
      if (action === "pick") document.getElementById("product-file").click();
      if (action === "remove-image") { readEditor(); editor.image = ""; render(); }
      if (action === "save-product") saveProduct();
      if (action === "delete-product") {
        if (confirm(t("product.deleteConfirm"))) {
          state.products = state.products.filter((row) => row.id !== editor.id);
          state.cart = state.cart.filter((row) => row.productId !== editor.id);
          editor = null;
          save();
          render();
        }
      }
      if (action === "new-session") startNewSession();
      if (action === "pdf-session") exportPdf("session", node.dataset.id);
      if (action === "pdf-sale") exportPdf("sale", node.dataset.id);
      if (action === "save-name") saveStallName();
      if (action === "lang") { state.settings.language = node.dataset.code; notice = ""; save(); render(); }
      if (action === "toggle" && node.dataset.code !== "HKD") {
        const code = node.dataset.code;
        state.settings.enabled = state.settings.enabled.includes(code)
          ? state.settings.enabled.filter((item) => item !== code)
          : [...state.settings.enabled, code];
        if (!state.settings.enabled.includes(state.settings.pay)) state.settings.pay = "HKD";
        save();
        render();
      }
      if (action === "save-rate") saveRate(node.dataset.code, false);
      if (action === "clear-rate") saveRate(node.dataset.code, true);
    });

    document.body.addEventListener("change", (event) => {
      if (event.target.id !== "product-file" || !event.target.files[0]) return;
      const reader = new FileReader();
      reader.onload = () => { readEditor(); editor.image = String(reader.result); render(); };
      reader.readAsDataURL(event.target.files[0]);
    });

    function readEditor() {
      editor.name = document.getElementById("product-name").value;
      for (const input of document.querySelectorAll("[data-price]")) editor.prices[input.dataset.price] = input.value;
    }
    function saveProduct() {
      readEditor();
      const name = editor.name.trim();
      if (!name) { editor.error = t("product.nameRequired"); render(); return; }
      const prices = {};
      for (const code of state.settings.enabled) {
        const raw = (editor.prices[code] || "").trim();
        if (!raw) continue;
        const minor = parseMajor(raw, EXPONENT[code]);
        if (minor === null) { editor.error = t("product.priceInvalid"); render(); return; }
        prices[code] = minor;
      }
      if (editor.id) {
        const product = state.products.find((row) => row.id === editor.id);
        product.name = name;
        product.image = editor.image;
        product.prices = prices;
      } else {
        state.products.push({ id: crypto.randomUUID(), name, image: editor.image, prices });
      }
      editor = null;
      save();
      render();
    }
    function saveStallName() {
      const input = document.getElementById("stall-name");
      state.settings.stallName = input.value.trim();
      const current = state.sessions.find((item) => !item.closedAt);
      if (current) current.name = state.settings.stallName;
      nameNote = t("settings.nameSaved");
      save();
      render();
    }
    function saveRate(code, clear) {
      const input = document.querySelector(`[data-rate="${code}"]`);
      if (clear || !input.value.trim()) {
        delete state.settings.rates[code];
        rateNote = t("settings.rateCleared");
      } else {
        const minor = parseMajor(input.value, EXPONENT[code]);
        if (minor === null || minor <= 0) { rateNote = t("settings.rateInvalid"); render(); return; }
        state.settings.rates[code] = minor;
        rateNote = t("settings.rateSaved");
      }
      save();
      render();
    }

    save();
    render();
  </script>
</body>
</html>
